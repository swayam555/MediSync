services:
  patient-service-db:
    image: postgres:16
    environment: {POSTGRES_DB: db, POSTGRES_USER: admin_user, POSTGRES_PASSWORD: password}
  auth-service-db:
    image: postgres:16
    environment: {POSTGRES_DB: db, POSTGRES_USER: admin_user, POSTGRES_PASSWORD: password}
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  auth-service:
    build: ./auth-service
    depends_on: [auth-service-db]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: Y2hhVEc3aGJzYzI4MzR5aHNkZmtqaHNkZmxrajIzNDU2Nzg5MDEyMzQ1Ng==
  billing-service:
    build: ./billing-service
  patient-service:
    build: ./patient-service
    depends_on: [patient-service-db, kafka, billing-service]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001
  analytics-service:
    build: ./analytics-service
    depends_on: [kafka]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  api-gateway:
    build: ./api-gateway
    depends_on: [auth-service, patient-service]
    ports: ["4004:4004"]
    environment:
      AUTH_SERVICE_URL: http://auth-service:4005
